services:
  # Subsystem 1: PX4 SITL + Gazebo Harmonic + ROS 2 Jazzy Container
  px4-sitl:
    build:
      context: ./simulation/docker
      dockerfile: px4.Dockerfile
    image: infynex-px4-sitl:jazzy
    container_name: infynex_px4_sitl
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      - HEADLESS=${PX4_HEADLESS:-1}
      - PX4_SYS_AUTOSTART=4001
      - PX4_GZ_MODEL=x500
    volumes:
      - ./:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ipc: host
    privileged: true
    command: ["headless"]

  # Subsystem 4: Eclipse Mosquitto MQTT Broker (IoT Sensor Network)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: infynex_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./iot_simulation/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Subsystem 7: PostgreSQL 16 with TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: infynex_timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=infynex
      - POSTGRES_PASSWORD=infynex_pass
      - POSTGRES_DB=infynex_db
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backend/app/database/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  # Subsystem 6: Edge Processing & API Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infynex-backend:latest
    container_name: infynex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://infynex:infynex_pass@timescaledb:5432/infynex_db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    depends_on:
      - timescaledb
      - mosquitto
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
      - ./ai_engine:/app/ai_engine

  # Subsystem 8: Digital Twin Monitoring Dashboard (React + Three.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: infynex-dashboard:latest
    container_name: infynex_dashboard
    restart: unless-stopped
    ports:
      - "5173:3000"
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
      - ./dashboard/index.html:/app/index.html

volumes:
  mosquitto_data:
  mosquitto_log:
  timescale_data:
